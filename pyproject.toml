[project]
name = "rembg-ui"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "nuitka>=4.1.3",
    "numba==0.60.0",
    "numpy<2",
    # macOS 无 onnxruntime-gpu 的 wheel：CPU 版 onnxruntime 即可跑 rembg；
    # Windows / Linux 用 GPU 版（无 GPU 时 _detect_providers 会自动回退 CPU）
    "onnxruntime-gpu>=1.24.3; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime>=1.24.3; sys_platform == 'darwin'",
    "pillow>=12.3.0",
    "pymatting>=1.1.12",
    "python-multipart>=0.0.32",
    "rembg>=2.0.69",
    # PyPI 的 Linux torch wheel 会连带 45 个 nvidia-* CUDA 包（~4 GB），
    # 把打包产物 tar.gz 撑破 GitHub Release 单资产 2 GiB 上限（曾致上传 422 失败）。
    # 本应用推理走 onnxruntime（rembg 主管线）/ torch CPU（SAM 是 MobileSAM，够用），
    # 因此 Linux 锁定到 PyTorch 官方 CPU 源；Windows 的 PyPI wheel 本就是 CPU 版，macOS 无 CUDA 版，无需处理。
    # ⚠️ uv 的 [tool.uv.sources] 只对直接依赖生效，故 torch 需显式声明（反正 ultralytics 必带它）。
    "torch>=2.13.0",
    "ultralytics>=8.4.104",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
# -cuda 构建变体：把 onnxruntime-gpu 所需的 CUDA 12 运行库（NVIDIA 官方 wheel，
# 含 cudnn 9 / cublas / cudart 等，安装后 ~2.5 GB）打进产物，用户免装 CUDA 即可 GPU 加速。
# 仅 Win/Linux 有 wheel，标记避免 macOS 下通用锁解析失败；macOS 加速走 CoreML（无需额外包）。
# 默认构建不装这组（CI 的 -cuda 变体 job 用 `uv sync --extra cuda`）。
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cufft-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-curand-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cusolver-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cusparse-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-nvjitlink-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
]
