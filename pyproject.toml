[project]
name = "rembg-ui"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.2",
    "nuitka>=4.1.3",
    "numba==0.60.0",
    "numpy<2",
    # macOS 无 onnxruntime-gpu 的 wheel：CPU 版 onnxruntime 即可跑 rembg；
    # Windows / Linux 用 GPU 版（无 GPU 时 _detect_providers 会自动回退 CPU）
    "onnxruntime-gpu>=1.24.3; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime>=1.24.3; sys_platform == 'darwin'",
    "pillow>=12.3.0",
    "pymatting>=1.1.12",
    "python-multipart>=0.0.32",
    "rembg>=2.0.69",
    "ultralytics>=8.4.104",
    "uvicorn>=0.51.0",
]
