<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rembg Studio</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #0f3460;
            --accent: #e94560;
            --accent-hover: #ff6b81;
            --text: #eee;
            --text-dim: #8892a0;
            --border: #2a2a4a;
            --success: #27ae60;
            --success-hover: #2ecc71;
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
        }
        .sidebar h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar h1::before { content: "✂"; font-size: 24px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-top: 8px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: var(--accent); }
        select { cursor: pointer; }
        select option { background: var(--bg-input); color: var(--text); }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.12);
            color: var(--accent);
            transform: scale(1.01);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }
        .drop-zone.has-file {
            border-style: solid;
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.08);
        }
        .drop-zone input { display: none; }
        .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
        .drop-zone .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .drop-zone .filename {
            font-size: 13px;
            color: var(--success);
            font-weight: 600;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover:not(:disabled) { background: var(--success-hover); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Advanced toggle */
        .advanced-toggle {
            font-size: 12px;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            user-select: none;
        }
        .advanced-toggle:hover { color: var(--text); }
        .advanced-panel {
            display: none;
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 14px;
            gap: 12px;
            flex-direction: column;
        }
        .advanced-panel.open { display: flex; }
        .param-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .param-row label {
            font-size: 12px;
            color: var(--text-dim);
        }
        .param-row input[type="range"] {
            width: 120px;
            accent-color: var(--accent);
        }
        .param-row .val {
            font-size: 12px;
            color: var(--accent);
            min-width: 30px;
            text-align: right;
        }

        /* Main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-dim);
        }
        .preview-area {
            flex: 1;
            display: flex;
            gap: 0;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .panel + .panel { border-left: 1px solid var(--border); }
        .panel-header {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .panel-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 16px;
            position: relative;
        }
        .panel-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }
        .panel-empty {
            color: var(--text-dim);
            font-size: 14px;
            text-align: center;
            line-height: 2;
        }
        .panel-empty .icon { font-size: 48px; opacity: 0.3; }

        /* Loading */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; color: var(--text-dim); }

        /* Drag overlay on panels */
        .drag-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(233, 69, 96, 0.12);
            border: 2px dashed var(--accent);
            border-radius: 4px;
            z-index: 5;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .panel-body.drag-over .drag-overlay { display: flex; opacity: 1; }

        /* Checkerboard for result */
        .checkerboard {
            background-image:
                linear-gradient(45deg, #2a2a4a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a4a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a4a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a4a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #22223a;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Rembg Studio</h1>

        <div class="section-label">模型</div>
        <select id="modelSelect">
            <optgroup label="✨ 推荐">
                <option value="bria-rmbg" selected>商业级 (bria-rmbg)</option>
                <option value="birefnet-massive">海量数据版 (birefnet-massive)</option>
                <option value="bria-rmbg">商业级 (bria-rmbg)</option>
            </optgroup>
            <optgroup label="👤 人像">
                <option value="birefnet-portrait">人像专用 (birefnet-portrait)</option>
                <option value="u2net_human_seg">人体发丝 (u2net_human_seg)</option>
            </optgroup>
            <optgroup label="🎨 动漫">
                <option value="isnet-anime">动漫插画 (isnet-anime)</option>
            </optgroup>
            <optgroup label="⚡ 极速">
                <option value="birefnet-general-lite">BiRefNet 轻量</option>
                <option value="u2net">通用均衡 (u2net)</option>
                <option value="u2netp">极速版 (u2netp)</option>
                <option value="silueta">最小体积 (silueta)</option>
            </optgroup>
            <optgroup label="🔧 其他">
                <option value="isnet-general-use">高精度通用</option>
                <option value="u2net_cloth_seg">服装解析</option>
                <option value="birefnet-dis">二分图像</option>
                <option value="birefnet-hrsod">高清显著</option>
                <option value="birefnet-cod">伪装检测</option>
                <option value="sam">SAM 通用分割</option>
            </optgroup>
        </select>

        <div class="section-label">输入</div>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" />
            <div class="icon">📁</div>
            <div id="dropHint">拖拽图片到这里，或点击选择</div>
            <div class="filename" id="dropFilename" style="display:none"></div>
            <div class="hint">支持 PNG / JPG / WEBP</div>
        </div>

        <div class="advanced-toggle" onclick="toggleAdvanced()">
            <span id="advArrow">▶</span> 高级参数
        </div>
        <div class="advanced-panel" id="advPanel">
            <div class="param-row">
                <label>Matting 精细边缘</label>
                <input type="checkbox" id="paramAlpha" />
            </div>
            <div class="param-row">
                <label>边缘羽化</label>
                <input type="range" id="paramErode" min="0" max="20" value="0" oninput="document.getElementById('erodeVal').textContent=this.value" />
                <span class="val" id="erodeVal">0</span>
            </div>
            <div class="param-row">
                <label>背景颜色</label>
                <select id="paramBg" style="width:auto;flex:0;padding:6px 10px;">
                    <option value="transparent" selected>透明</option>
                    <option value="white">白色</option>
                    <option value="black">黑色</option>
                </select>
            </div>
        </div>

        <div style="flex:1"></div>

        <button id="runBtn" class="btn btn-primary" onclick="processImage()" disabled>
            ⚡ 开始抠图
        </button>
        <button id="downloadBtn" class="btn btn-success" onclick="downloadResult()" disabled>
            💾 保存结果
        </button>
    </div>

    <div class="main">
        <div class="toolbar">
            <span id="statusText">就绪 — 选择图片开始</span>
            <span id="modelInfo">birefnet-general</span>
        </div>
        <div class="preview-area">
            <div class="panel">
                <div class="panel-header">原图</div>
                <div class="panel-body" id="origBody">
                    <div class="drag-overlay">📷 放开以载入图片</div>
                    <div class="panel-empty" id="origEmpty">
                        <div class="icon">🖼️</div>
                        拖拽或点击左侧选择图片
                    </div>
                    <img id="origImg" style="display:none" />
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">结果</div>
                <div class="panel-body checkerboard" id="resultBody">
                    <div class="panel-empty" id="resultEmpty">
                        <div class="icon">✨</div>
                        等待抠图...
                    </div>
                    <img id="resultImg" style="display:none" />
                    <div class="loading-overlay" id="loadingMask">
                        <div class="spinner"></div>
                        <div class="loading-text" id="loadingText">正在处理...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let resultBase64 = null;
        let currentFileName = "output.png";
        let selectedFile = null;

        // Model info
        document.getElementById("modelSelect").addEventListener("change", function() {
            document.getElementById("modelInfo").textContent = this.value;
        });

        // Advanced toggle
        function toggleAdvanced() {
            const panel = document.getElementById("advPanel");
            const arrow = document.getElementById("advArrow");
            panel.classList.toggle("open");
            arrow.textContent = panel.classList.contains("open") ? "▼" : "▶";
        }

        // File select
        document.getElementById("fileInput").addEventListener("change", function() {
            if (this.files[0]) loadFile(this.files[0]);
        });

        // Drop zone
        const dropZone = document.getElementById("dropZone");
        let dragCounter = 0;
        dropZone.addEventListener("dragenter", e => { e.preventDefault(); dragCounter++; dropZone.classList.add("drag-over"); });
        dropZone.addEventListener("dragleave", e => { dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropZone.classList.remove("drag-over"); } });
        dropZone.addEventListener("dragover", e => e.preventDefault());
        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) loadFile(file);
        });

        // Panel drag & drop
        const origBody = document.getElementById("origBody");
        let origDragCounter = 0;
        origBody.addEventListener("dragenter", e => { e.preventDefault(); origDragCounter++; origBody.classList.add("drag-over"); });
        origBody.addEventListener("dragleave", e => { origDragCounter--; if (origDragCounter <= 0) { origDragCounter = 0; origBody.classList.remove("drag-over"); } });
        origBody.addEventListener("dragover", e => e.preventDefault());
        origBody.addEventListener("drop", e => {
            e.preventDefault();
            origDragCounter = 0;
            origBody.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) loadFile(file);
        });

        // Paste support
        document.addEventListener("paste", e => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith("image/")) {
                    const file = item.getAsFile();
                    if (file) loadFile(file);
                    break;
                }
            }
        });

        function loadFile(file) {
            selectedFile = file;
            currentFileName = "rmbg_" + file.name.replace(/\.[^.]+$/, "") + ".png";

            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById("origImg").src = e.target.result;
                document.getElementById("origImg").style.display = "block";
                document.getElementById("origEmpty").style.display = "none";
                document.getElementById("runBtn").disabled = false;
                document.getElementById("dropHint").style.display = "none";
                document.getElementById("dropFilename").style.display = "block";
                document.getElementById("dropFilename").textContent = file.name;
                dropZone.classList.add("has-file");
                document.getElementById("statusText").textContent = "已载入: " + file.name;
            };
            reader.readAsDataURL(file);
        }

        async function processImage() {
            if (!selectedFile) return;

            document.getElementById("loadingMask").classList.add("active");
            document.getElementById("downloadBtn").disabled = true;
            document.getElementById("statusText").textContent = "处理中...";
            document.getElementById("runBtn").disabled = true;

            const modelSelect = document.getElementById("modelSelect");
            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("model_name", modelSelect.value);

            try {
                const response = await fetch("/api/remove-bg", {
                    method: "POST",
                    body: formData,
                });
                const data = await response.json();
                if (data.success) {
                    resultBase64 = data.image;
                    document.getElementById("resultImg").src = resultBase64;
                    document.getElementById("resultImg").style.display = "block";
                    document.getElementById("resultEmpty").style.display = "none";
                    document.getElementById("downloadBtn").disabled = false;
                    document.getElementById("statusText").textContent = "✅ 完成 — " + modelSelect.value;
                } else {
                    document.getElementById("statusText").textContent = "❌ 失败: " + (data.detail || "未知错误");
                    alert("抠图失败: " + data.detail);
                }
            } catch (error) {
                document.getElementById("statusText").textContent = "❌ 网络错误";
                alert("请求失败，请检查后端服务");
                console.error(error);
            } finally {
                document.getElementById("loadingMask").classList.remove("active");
                document.getElementById("runBtn").disabled = false;
            }
        }

        async function downloadResult() {
            if (!resultBase64) return;
            try {
                const response = await fetch("/api/save-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        base64_data: resultBase64,
                        filename: currentFileName,
                    }),
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById("statusText").textContent = "💾 已保存: " + data.path;
                }
            } catch (error) {
                alert("保存失败");
                console.error(error);
            }
        }

        // Keyboard shortcut
        document.addEventListener("keydown", e => {
            if (e.ctrlKey && e.key === "Enter") processImage();
            if (e.ctrlKey && e.key === "s") { e.preventDefault(); downloadResult(); }
        });
    </script>
</body>
</html>
