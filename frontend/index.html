<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rembg Studio</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #0f3460;
            --accent: #e94560;
            --accent-hover: #ff6b81;
            --text: #eee;
            --text-dim: #8892a0;
            --border: #2a2a4a;
            --success: #27ae60;
            --success-hover: #2ecc71;
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
        }
        .sidebar h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar h1::before { content: "✂"; font-size: 24px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-top: 8px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: var(--accent); }
        select { cursor: pointer; }
        select option { background: var(--bg-input); color: var(--text); }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.12);
            color: var(--accent);
            transform: scale(1.01);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }
        .drop-zone.has-file {
            border-style: solid;
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.08);
        }
        .drop-zone input { display: none; }
        .drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
        .drop-zone .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .drop-zone .filename {
            font-size: 13px;
            color: var(--success);
            font-weight: 600;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover:not(:disabled) { background: var(--success-hover); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Advanced toggle */
        .advanced-toggle {
            font-size: 12px;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            user-select: none;
        }
        .advanced-toggle:hover { color: var(--text); }
        .advanced-panel {
            display: none;
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 14px;
            gap: 12px;
            flex-direction: column;
        }
        .advanced-panel.open { display: flex; }
        .param-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .param-row label {
            font-size: 12px;
            color: var(--text-dim);
            flex: 1;
        }
        .param-row input[type="range"] {
            width: 100px;
            accent-color: var(--accent);
        }
        .param-row .val {
            font-size: 12px;
            color: var(--accent);
            min-width: 30px;
            text-align: right;
        }
        .param-row input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .mode-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 3px;
        }
        .mode-tab {
            flex: 1;
            padding: 8px 4px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .mode-tab.active {
            background: var(--accent);
            color: white;
        }
        .mode-tab:hover:not(.active) { color: var(--text); }
        #samModeContent { display: none; }
        #samModeContent.visible { display: block; }

        .model-dir-box {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .model-dir-box:hover { border-color: var(--accent); }
        .model-dir-path {
            font-size: 11px;
            color: var(--accent);
            font-family: monospace;
            word-break: break-all;
            line-height: 1.4;
        }
        .model-dir-hint {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .model-status {
            font-size: 11px;
            margin-top: 6px;
            color: var(--success);
        }
        .model-status.has-missing {
            color: #e6a817;
        }

        .sam-hint {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            padding: 6px;
            background: var(--bg-input);
            border-radius: var(--radius);
        }
        .candidate-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .candidate-item {
            flex: 1;
            min-width: 80px;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .candidate-item:hover { border-color: var(--accent); }
        .candidate-item.active { border-color: var(--accent); background: rgba(233,69,96,0.12); }
        .candidate-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
        .candidate-info {
            padding: 4px 6px;
            font-size: 10px;
            color: var(--text-dim);
            line-height: 1.4;
        }
        .candidate-info .score { color: var(--accent); font-weight: 600; }

        [data-sam-mode=true] #origImg { cursor: crosshair; }
        #resultImg.sam-has-result { cursor: cell; }

        /* Point overlay */
        .sam-points-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 100%;
        }
        .sam-points-wrapper img { display: block; max-width: 100%; max-height: 100%; }
        #pointCanvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }
        .sam-point-type-toggle {
            display: flex; gap: 6px; margin-top: 6px;
        }
        .sam-point-type-toggle button {
            flex: 1; padding: 6px; font-size: 11px; font-weight: 600;
            border: 2px solid transparent; border-radius: var(--radius);
            cursor: pointer; transition: all 0.2s;
            background: var(--bg-input); color: var(--text-dim);
        }
        .sam-point-type-toggle .pt-positive.active {
            border-color: #2ecc71; color: #2ecc71; background: rgba(46, 204, 113, 0.1);
        }
        .sam-point-type-toggle .pt-negative.active {
            border-color: #e74c3c; color: #e74c3c; background: rgba(231, 76, 60, 0.1);
        }
        .sam-toolbar {
            display: flex; gap: 6px; margin-top: 6px;
        }
        .sam-toolbar button {
            flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
            border: none; border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
        }
        .sam-toolbar .run-sam {
            background: var(--accent); color: white;
        }
        .sam-toolbar .run-sam:hover { filter: brightness(1.15); }
        .sam-toolbar .clear-points {
            background: var(--bg-input); color: var(--text-dim); border: 1px solid var(--border);
        }
        .sam-toolbar .clear-points:hover { border-color: var(--accent); }
        .sam-points-info {
            font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 4px;
        }

        /* Preprocess toolbar */
        .preprocess-bar {
            display: flex; gap: 4px; align-items: center; padding: 0 4px;
        }
        .preprocess-bar button {
            padding: 4px 10px; font-size: 11px; font-weight: 600;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg-input); color: var(--text-dim);
            cursor: pointer; transition: all 0.15s;
        }
        .preprocess-bar button:hover { border-color: var(--accent); color: var(--text); }
        .preprocess-bar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .preprocess-bar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

        /* Crop overlay */
        #cropCanvas {
            position: absolute; top: 0; left: 0;
            cursor: crosshair; z-index: 2;
        }
        .crop-rect {
            position: absolute; border: 2px dashed var(--accent);
            background: rgba(233, 69, 96, 0.08);
            pointer-events: none; z-index: 3;
            display: none;
        }
        .crop-rect.show { display: block; }

        /* Main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-dim);
        }
        .preview-area {
            flex: 1;
            display: flex;
            gap: 0;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .panel + .panel { border-left: 1px solid var(--border); flex: 2; }
        .panel-header {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .panel-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 16px;
            position: relative;
        }
        .panel-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }
        .panel-empty {
            color: var(--text-dim);
            font-size: 14px;
            text-align: center;
            line-height: 2;
        }
        .panel-empty .icon { font-size: 48px; opacity: 0.3; }

        /* Loading */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 46, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; color: var(--text-dim); }

        /* Drag overlay on panels */
        .drag-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(233, 69, 96, 0.12);
            border: 2px dashed var(--accent);
            border-radius: 4px;
            z-index: 5;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .panel-body.drag-over .drag-overlay { display: flex; opacity: 1; }

        /* Checkerboard for result */
        .checkerboard {
            background-image:
                linear-gradient(45deg, #2a2a4a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a4a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a4a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a4a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #22223a;
        }

        .sponsor-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .sponsor-modal-overlay.active { display: flex; }
        .sponsor-modal {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; width: 460px; max-width: 92vw; max-height: 88vh;
            overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: sponsorIn 0.25s ease;
        }
        @keyframes sponsorIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .sponsor-header {
            display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 0;
        }
        .sponsor-header h2 { font-size: 18px; font-weight: 700; color: var(--accent); margin: 0; }
        .sponsor-close {
            background: none; border: none; color: var(--text-dim);
            font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
        }
        .sponsor-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .sponsor-body { padding: 18px 22px 22px; }
        .sponsor-qr-section { text-align: center; margin-bottom: 18px; }
        .sponsor-qr-section canvas, .sponsor-qr-section img {
            border-radius: 10px; border: 3px solid var(--border); margin-bottom: 10px;
        }
        .sponsor-qr-label { font-size: 13px; color: var(--text-dim); }
        .sponsor-actions { display: flex; gap: 10px; margin-bottom: 18px; }
        .sponsor-btn {
            flex: 1; padding: 10px 14px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .sponsor-btn-copy { background: var(--accent); color: white; }
        .sponsor-btn-copy:hover { filter: brightness(1.15); }
        .sponsor-btn-save {
            background: var(--bg-input); color: var(--text);
            border: 1px solid var(--border);
        }
        .sponsor-btn-save:hover { border-color: var(--accent); }
        .sponsor-tutorials { margin-top: 4px; }
        .sponsor-tutorials .st-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-dim); margin-bottom: 10px;
        }
        .sponsor-tutorial-link {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); text-decoration: none;
            font-size: 13px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
        }
        .sponsor-tutorial-link:hover { border-color: var(--accent); background: rgba(233,69,96,0.08); }
        .sponsor-tutorial-icon {
            width: 32px; height: 32px; border-radius: 6px;
            background: var(--accent); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; flex-shrink: 0;
        }
        .sponsor-tutorial-info { flex: 1; }
        .sponsor-tutorial-title { font-weight: 600; }
        .sponsor-tutorial-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        .sponsor-tutorial-arrow { color: var(--text-dim); font-size: 12px; }
        .sponsor-footer {
            text-align: center; padding-top: 14px; border-top: 1px solid var(--border);
            font-size: 11px; color: var(--text-dim);
        }
        .sponsor-footer a { color: var(--accent); text-decoration: none; }
        .sponsor-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Rembg Studio</h1>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="rembg" onclick="switchMode('rembg')">Rembg 去背景</button>
            <button class="mode-tab" data-mode="sam" onclick="switchMode('sam')">SAM 抠图</button>
        </div>

        <!-- Rembg mode content -->
        <div id="rembgModeContent">
            <div class="section-label">模型</div>
            <select id="modelSelect">
                <optgroup label="✨ 推荐">
                    <option value="bria-rmbg" selected>商业级 (bria-rmbg)</option>
                    <option value="birefnet-general">最强通用 (birefnet-general)</option>
                    <option value="birefnet-massive">海量数据版 (birefnet-massive)</option>
                </optgroup>
                <optgroup label="👤 人像">
                    <option value="birefnet-portrait">人像专用 (birefnet-portrait)</option>
                    <option value="u2net_human_seg">人体发丝 (u2net_human_seg)</option>
                </optgroup>
                <optgroup label="🎨 动漫">
                    <option value="isnet-anime">动漫插画 (isnet-anime)</option>
                </optgroup>
                <optgroup label="⚡ 极速">
                    <option value="birefnet-general-lite">BiRefNet 轻量</option>
                    <option value="u2net">通用均衡 (u2net)</option>
                    <option value="u2netp">极速版 (u2netp)</option>
                    <option value="silueta">最小体积 (silueta)</option>
                </optgroup>
                <optgroup label="🔧 其他">
                    <option value="isnet-general-use">高精度通用</option>
                    <option value="u2net_cloth_seg">服装解析</option>
                    <option value="birefnet-dis">二分图像</option>
                    <option value="birefnet-hrsod">高清显著</option>
                    <option value="birefnet-cod">伪装检测</option>
                    <option value="sam">SAM 通用分割</option>
                </optgroup>
            </select>

            <div class="advanced-toggle" onclick="toggleAdvanced()">
                <span id="advArrow">▶</span> 高级参数
            </div>

            <div class="advanced-panel" id="advPanel">
                <div class="param-row">
                    <label>Alpha Matting 精细边缘</label>
                    <input type="checkbox" id="paramAlpha" onchange="document.getElementById('alphaParams').style.display=this.checked?'flex':'none'" />
                </div>
                <div id="alphaParams" style="display:none;flex-direction:column;gap:10px;padding:8px 0;">
                    <div class="param-row">
                        <label>前景阈值</label>
                        <input type="range" id="paramFg" min="0" max="255" value="240" oninput="document.getElementById('fgVal').textContent=this.value" />
                        <span class="val" id="fgVal">240</span>
                    </div>
                    <div class="param-row">
                        <label>背景阈值</label>
                        <input type="range" id="paramBg" min="0" max="255" value="10" oninput="document.getElementById('bgVal').textContent=this.value" />
                        <span class="val" id="bgVal">10</span>
                    </div>
                    <div class="param-row">
                        <label>腐蚀大小</label>
                        <input type="range" id="paramErode" min="0" max="40" value="10" oninput="document.getElementById('erodeVal').textContent=this.value" />
                        <span class="val" id="erodeVal">10</span>
                    </div>
                </div>
                <div class="param-row">
                    <label>后处理遮罩</label>
                    <input type="checkbox" id="paramPostProcess" />
                </div>
                <div class="param-row">
                    <label>仅输出遮罩</label>
                    <input type="checkbox" id="paramOnlyMask" />
                </div>
            </div>
        </div>

        <!-- SAM mode content -->
        <div id="samModeContent">
            <div class="sam-hint">
                🎯 自动检测全部物体 → 选中最像衣服的遮罩<br/>
                点结果图排除多余区域（如同 PS 快速选择）
            </div>
            <button id="samLoadBtn" class="btn btn-primary" onclick="samLoadImage()" disabled>
                📥 载入到 SAM
            </button>

            <div class="sam-toolbar" id="samAutoBar" style="display:none">
                <button class="run-sam" onclick="samAutoDetect()" style="flex:1;padding:8px;font-size:12px;font-weight:600;border:none;border-radius:var(--radius);cursor:pointer;background:var(--accent);color:white">
                    🎯 自动检测全部物体
                </button>
            </div>

            <div class="sam-point-type-toggle" id="pointTypeToggle" style="display:none">
                <button class="pt-positive active" onclick="setSamPointType('positive')">🟢 前景加选</button>
                <button class="pt-negative" onclick="setSamPointType('negative')">🔴 背景减选</button>
            </div>

            <div class="sam-toolbar" id="samToolbar" style="display:none">
                <button class="run-sam" onclick="runSam()">▶ 应用点</button>
                <button class="clear-points" onclick="clearSamPoints()">✕ 清除点</button>
            </div>

            <div class="sam-points-info" id="samPointsInfo"></div>

            <div class="sam-refine-hint" id="samRefineHint" style="display:none;font-size:11px;color:var(--text-dim);text-align:center;padding:4px;background:var(--bg-input);border-radius:var(--radius);margin-top:4px">
                💡 点击结果图中的多余区域可自动排除
            </div>

            <div id="samCandidates" style="display:none">
                <div class="section-label" style="margin-top:8px">候选遮罩</div>
                <div class="candidate-row" id="candidateRowSide"></div>
            </div>
        </div>

        <div class="section-label">输入</div>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" />
            <div class="icon">📁</div>
            <div id="dropHint">拖拽图片到这里，或点击选择</div>
            <div class="filename" id="dropFilename" style="display:none"></div>
            <div class="hint">支持 PNG / JPG / WEBP</div>
        </div>

        <div class="section-label">模型目录</div>
        <div class="model-dir-box" id="modelDirBox" onclick="openModelDir()">
            <div class="model-dir-path" id="modelDirPath">加载中...</div>
            <div class="model-dir-hint">点击查看 / 打开目录</div>
            <div class="model-status" id="modelStatus"></div>
        </div>

        <div style="flex:1"></div>

        <button id="runBtn" class="btn btn-primary" onclick="processImage()" disabled>
            ⚡ 开始抠图
        </button>
        <button id="downloadBtn" class="btn btn-success" onclick="downloadResult()" disabled>
            💾 保存结果
        </button>
        <button class="btn" style="background:var(--bg-input);color:var(--text-dim);border:1px solid var(--border);margin-top:4px" onclick="openSponsorModal()">
            ❤ 赞助与教程
        </button>
    </div>

    <div class="main">
        <div class="toolbar">
            <span id="statusText">就绪 — 选择图片开始</span>
            <div class="preprocess-bar" id="preprocessBar" style="display:none">
                <button onclick="toggleCropMode()" id="cropBtn">✂ 裁剪</button>
                <button onclick="rotateImage(90)">↻ 右旋</button>
                <button onclick="rotateImage(-90)">↺ 左旋</button>
                <div class="sep"></div>
                <button onclick="resetImage()" style="color:#e74c3c">✕ 重置</button>
            </div>
            <span id="modelInfo">bria-rmbg</span>
        </div>
        <div class="preview-area">
            <div class="panel">
                <div class="panel-header">原图</div>
                <div class="panel-body" id="origBody">
                    <div class="drag-overlay">📷 放开以载入图片</div>
                    <div class="panel-empty" id="origEmpty">
                        <div class="icon">🖼️</div>
                        拖拽或点击左侧选择图片
                    </div>
                    <div class="sam-points-wrapper" id="origWrapper" style="display:none">
                        <img id="origImg" />
                        <canvas id="pointCanvas"></canvas>
                        <canvas id="cropCanvas"></canvas>
                        <div class="crop-rect" id="cropRect"></div>
                    </div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">结果</div>
                <div class="panel-body checkerboard" id="resultBody">
                    <div class="panel-empty" id="resultEmpty">
                        <div class="icon">✨</div>
                        等待抠图...
                    </div>
                    <img id="resultImg" style="display:none" />
                    <div class="loading-overlay" id="loadingMask">
                        <div class="spinner"></div>
                        <div class="loading-text" id="loadingText">正在处理...</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let resultBase64 = null;
        let currentFileName = "output.png";
        let selectedFile = null;
        let originalFileName = null;
        let originalFileRef = null; // original File object for reset
        let isCroppedOrRotated = false;

        // Crop state
        let cropActive = false;
        let cropStart = null;
        let cropRect = null;

        // Model info / mode display
        document.getElementById("modelSelect").addEventListener("change", function() {
            document.getElementById("modelInfo").textContent = this.value;
        });
        function updateToolbarInfo() {
            document.getElementById("modelInfo").textContent = currentMode === "sam" ? "MobileSAM" : document.getElementById("modelSelect").value;
        }

        // Advanced toggle
        function toggleAdvanced() {
            const panel = document.getElementById("advPanel");
            const arrow = document.getElementById("advArrow");
            panel.classList.toggle("open");
            arrow.textContent = panel.classList.contains("open") ? "▼" : "▶";
        }

        // File select
        document.getElementById("fileInput").addEventListener("change", function() {
            if (this.files[0]) loadFile(this.files[0]);
        });

        // Drop zone
        const dropZone = document.getElementById("dropZone");
        let dragCounter = 0;
        dropZone.addEventListener("dragenter", e => { e.preventDefault(); dragCounter++; dropZone.classList.add("drag-over"); });
        dropZone.addEventListener("dragleave", e => { dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropZone.classList.remove("drag-over"); } });
        dropZone.addEventListener("dragover", e => e.preventDefault());
        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) loadFile(file);
        });

        // Panel drag & drop
        const origBody = document.getElementById("origBody");
        let origDragCounter = 0;
        origBody.addEventListener("dragenter", e => { e.preventDefault(); origDragCounter++; origBody.classList.add("drag-over"); });
        origBody.addEventListener("dragleave", e => { origDragCounter--; if (origDragCounter <= 0) { origDragCounter = 0; origBody.classList.remove("drag-over"); } });
        origBody.addEventListener("dragover", e => e.preventDefault());
        origBody.addEventListener("drop", e => {
            e.preventDefault();
            origDragCounter = 0;
            origBody.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) loadFile(file);
        });

        // Paste support
        document.addEventListener("paste", e => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith("image/")) {
                    const file = item.getAsFile();
                    if (file) loadFile(file);
                    break;
                }
            }
        });

        function loadFile(file) {
            selectedFile = file;
            originalFileName = file.name;
            originalFileRef = file;
            isCroppedOrRotated = false;
            currentFileName = "rmbg_" + file.name.replace(/\.[^.]+$/, "") + ".png";
            document.getElementById("preprocessBar").style.display = "flex";

            const reader = new FileReader();
            reader.onload = e => {
                const dataUrl = e.target.result;
                const img = document.getElementById("origImg");
                const wrapper = document.getElementById("origWrapper");
                img.src = dataUrl;
                img.style.display = "block";
                wrapper.style.display = "inline-block";
                document.getElementById("origEmpty").style.display = "none";
                document.getElementById("runBtn").disabled = false;
                document.getElementById("dropHint").style.display = "none";
                document.getElementById("dropFilename").style.display = "block";
                document.getElementById("dropFilename").textContent = file.name;
                dropZone.classList.add("has-file");
                document.getElementById("statusText").textContent = "已载入: " + file.name;
                document.getElementById("samLoadBtn").disabled = false;
                samLoaded = false;
                samOrigImageData = dataUrl;
                img.onload = () => {
                    drawSamPoints();
                    exitCropMode();
                };
            };
            reader.readAsDataURL(file);
        }

        // Click handlers on orig image and result image
        document.getElementById("origImg").addEventListener("click", onOrigImageClick);
        document.getElementById("resultImg").addEventListener("click", onResultImageClick);

        async function processImage() {
            if (!selectedFile) return;

            document.getElementById("loadingMask").classList.add("active");
            document.getElementById("downloadBtn").disabled = true;
            document.getElementById("statusText").textContent = "处理中...";
            document.getElementById("runBtn").disabled = true;

            const modelSelect = document.getElementById("modelSelect");
            const formData = new FormData();
            formData.append("file", selectedFile, selectedFile.name || originalFileName || "image.png");
            formData.append("model_name", modelSelect.value);
            formData.append("alpha_matting", document.getElementById("paramAlpha").checked);
            formData.append("alpha_matting_fg", document.getElementById("paramFg").value);
            formData.append("alpha_matting_bg", document.getElementById("paramBg").value);
            formData.append("alpha_matting_erode", document.getElementById("paramErode").value);
            formData.append("post_process", document.getElementById("paramPostProcess").checked);
            formData.append("only_mask", document.getElementById("paramOnlyMask").checked);

            try {
                const response = await fetch("/api/remove-bg", {
                    method: "POST",
                    body: formData,
                });
                const data = await response.json();
                if (data.success) {
                    resultBase64 = data.image;
                    document.getElementById("resultImg").src = resultBase64;
                    document.getElementById("resultImg").style.display = "block";
                    document.getElementById("resultEmpty").style.display = "none";
                    document.getElementById("downloadBtn").disabled = false;
                    document.getElementById("statusText").textContent = "✅ 完成 — " + modelSelect.value;
                } else {
                    document.getElementById("statusText").textContent = "❌ 失败: " + (data.detail || "未知错误");
                    alert("抠图失败: " + data.detail);
                }
            } catch (error) {
                document.getElementById("statusText").textContent = "❌ 网络错误";
                alert("请求失败，请检查后端服务");
                console.error(error);
            } finally {
                document.getElementById("loadingMask").classList.remove("active");
                document.getElementById("runBtn").disabled = false;
            }
        }

        async function downloadResult() {
            if (!resultBase64) return;
            try {
                const response = await fetch("/api/save-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        base64_data: resultBase64,
                        filename: currentFileName,
                    }),
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById("statusText").textContent = "💾 已保存: " + data.path;
                }
            } catch (error) {
                alert("保存失败");
                console.error(error);
            }
        }

        // Keyboard shortcut
        document.addEventListener("keydown", e => {
            if (e.ctrlKey && e.key === "Enter") processImage();
            if (e.ctrlKey && e.key === "s") { e.preventDefault(); downloadResult(); }
            if (e.key === "Escape") exitCropMode();
            if (e.key === "Enter" && cropActive) applyCrop();
        });

        // ─── Preprocess: crop / rotate ────────────────────────────

        // Replace displayed image with a new one (blob)
        function replaceDisplayedImage(blob) {
            selectedFile = blob;
            isCroppedOrRotated = true;
            samLoaded = false;
            document.getElementById("samLoadBtn").disabled = false;

            const reader = new FileReader();
            reader.onload = e => {
                const dataUrl = e.target.result;
                document.getElementById("origImg").src = dataUrl;
                document.getElementById("origImg").onload = () => {
                    drawSamPoints();
                    sizeCropCanvases();
                };
                samOrigImageData = dataUrl;
                // Clear previous results
                document.getElementById("resultEmpty").style.display = "block";
                document.getElementById("resultEmpty").innerHTML = '<div class="icon">🖼️</div>已更新原图';
                document.getElementById("resultImg").style.display = "none";
                document.getElementById("resultImg").src = "";
                resultBase64 = null;
                document.getElementById("downloadBtn").disabled = true;
            };
            reader.readAsDataURL(blob);
        }

        // Crop mode
        function toggleCropMode() {
            if (cropActive) { exitCropMode(); return; }
            const img = document.getElementById("origImg");
            if (!img.src || img.style.display === "none") return;
            cropActive = true;
            document.getElementById("cropBtn").classList.add("active");
            document.getElementById("cropCanvas").style.display = "block";
            document.getElementById("pointCanvas").style.pointerEvents = "none"; // prevent point placement during crop
            sizeCropCanvases();
            document.getElementById("statusText").textContent = "✂ 拖拽选择裁剪区域，按 Enter 确认，Esc 取消";
        }

        function exitCropMode() {
            cropActive = false;
            document.getElementById("cropBtn").classList.remove("active");
            document.getElementById("cropCanvas").style.display = "none";
            document.getElementById("cropRect").classList.remove("show");
            document.getElementById("pointCanvas").style.pointerEvents = "none";
            cropStart = null;
            cropRect = null;
            document.getElementById("statusText").textContent = "已取消裁剪";
        }

        function sizeCropCanvases() {
            const img = document.getElementById("origImg");
            if (!img || img.naturalWidth === 0) return;
            const w = img.getBoundingClientRect().width;
            const h = img.getBoundingClientRect().height;
            ["cropCanvas", "pointCanvas"].forEach(id => {
                const c = document.getElementById(id);
                if (c) { c.width = w; c.height = h; }
            });
        }

        // Crop mouse handlers
        document.getElementById("cropCanvas").addEventListener("mousedown", e => {
            if (!cropActive) return;
            const rect = document.getElementById("cropCanvas").getBoundingClientRect();
            cropStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });

        document.getElementById("cropCanvas").addEventListener("mousemove", e => {
            if (!cropActive || !cropStart) return;
            const rect = document.getElementById("cropCanvas").getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rx = document.getElementById("cropRect");
            rx.classList.add("show");
            rx.style.left = Math.min(cropStart.x, x) + "px";
            rx.style.top = Math.min(cropStart.y, y) + "px";
            rx.style.width = Math.abs(x - cropStart.x) + "px";
            rx.style.height = Math.abs(y - cropStart.y) + "px";
            cropRect = {
                x: Math.min(cropStart.x, x),
                y: Math.min(cropStart.y, y),
                w: Math.abs(x - cropStart.x),
                h: Math.abs(y - cropStart.y),
            };
        });

        document.addEventListener("mouseup", () => {
            if (!cropActive) return;
            cropStart = null;
            if (cropRect && (cropRect.w < 5 || cropRect.h < 5)) {
                exitCropMode();
            } else if (cropRect) {
                document.getElementById("statusText").textContent =
                    `✂ 选区 ${Math.round(cropRect.w)}×${Math.round(cropRect.h)}，按 Enter 确认`;
            }
        });

        function applyCrop() {
            if (!cropRect || cropRect.w < 5 || cropRect.h < 5) return;
            const img = document.getElementById("origImg");
            const scaleX = img.naturalWidth / img.getBoundingClientRect().width;
            const scaleY = img.naturalHeight / img.getBoundingClientRect().height;

            const sx = Math.round(cropRect.x * scaleX);
            const sy = Math.round(cropRect.y * scaleY);
            const sw = Math.round(cropRect.w * scaleX);
            const sh = Math.round(cropRect.h * scaleY);

            const canvas = document.createElement("canvas");
            canvas.width = sw;
            canvas.height = sh;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

            canvas.toBlob(blob => {
                blob.name = originalFileName || "crop.png";
                exitCropMode();
                replaceDisplayedImage(blob);
                document.getElementById("statusText").textContent =
                    `✅ 已裁剪至 ${sw}×${sh}`;
            }, "image/png");
        }

        function rotateImage(deg) {
            const img = document.getElementById("origImg");
            if (!img.src || img.style.display === "none") return;

            const canvas = document.createElement("canvas");
            const w = img.naturalWidth, h = img.naturalHeight;
            canvas.width = deg === 90 || deg === -90 ? h : w;
            canvas.height = deg === 90 || deg === -90 ? w : h;
            const ctx = canvas.getContext("2d");

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(deg * Math.PI / 180);
            ctx.drawImage(img, -w / 2, -h / 2);

            canvas.toBlob(blob => {
                blob.name = originalFileName || "rotated.png";
                replaceDisplayedImage(blob);
                document.getElementById("statusText").textContent = `↻ 旋转 ${deg}°`;
            }, "image/png");
        }

        function resetImage() {
            if (!originalFileRef) return;
            const wasCropped = isCroppedOrRotated;
            loadFile(originalFileRef);
            if (wasCropped) {
                document.getElementById("statusText").textContent = "↺ 已恢复原始图片";
            }
            exitCropMode();
        }

        // ─── end preprocess ────────────────────────────────────────

        // Mode switching
        let currentMode = "rembg";
        function switchMode(mode) {
            exitCropMode();
            currentMode = mode;
            document.querySelectorAll(".mode-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
            document.getElementById("rembgModeContent").style.display = mode === "rembg" ? "block" : "none";
            document.getElementById("samModeContent").style.display = mode === "sam" ? "block" : "none";
            document.getElementById("origBody").dataset.samMode = mode === "sam" ? "true" : "false";
            document.getElementById("resultImg").classList.remove("sam-has-result");

            document.getElementById("samCandidates").style.display = "none";
            document.getElementById("samAutoBar").style.display = "none";
            document.getElementById("pointTypeToggle").style.display = "none";
            document.getElementById("samToolbar").style.display = "none";
            document.getElementById("samRefineHint").style.display = "none";
            document.getElementById("samLoadBtn").disabled = !selectedFile;
            if (mode === "sam") {
                document.getElementById("statusText").textContent = "SAM 模式 — 先载入图片";
            }
            updateToolbarInfo();
        }

        // SAM state
        let samLoaded = false;
        let samOrigImageData = null;
        let samPoints = [];
        let samPointType = "positive";
        let samSelectedIndex = 0;

        // SAM: load image
        async function samLoadImage() {
            if (!selectedFile) return;
            document.getElementById("loadingMask").classList.add("active");
            document.getElementById("loadingText").textContent = "SAM 加载图片中...";
            document.getElementById("statusText").textContent = "SAM 编码图片中...";

            const formData = new FormData();
            formData.append("file", selectedFile, selectedFile.name || originalFileName || "image.png");

            try {
                const resp = await fetch("/api/sam/load-image", { method: "POST", body: formData });
                const data = await resp.json();
                if (data.success) {
                    samLoaded = true;
                    clearSamPoints();
                    document.getElementById("samAutoBar").style.display = "flex";
                    document.getElementById("samCandidates").style.display = "none";
        
                    document.getElementById("pointTypeToggle").style.display = "none";
                    document.getElementById("samToolbar").style.display = "none";
                    document.getElementById("samRefineHint").style.display = "none";
                    document.getElementById("resultBody").dataset.samHasResult = "false";
                    document.getElementById("resultEmpty").style.display = "block";
                    document.getElementById("resultEmpty").innerHTML = '<div class="icon">🎯</div>点「自动检测全部物体」识别所有区域';
                    document.getElementById("resultImg").style.display = "none";
                    document.getElementById("statusText").textContent = `SAM 就绪 — ${data.width}x${data.height}，点击自动检测`;
                    updateSamUI();
                }
            } catch (e) {
                document.getElementById("statusText").textContent = "❌ SAM 加载失败";
                console.error(e);
            } finally {
                document.getElementById("loadingMask").classList.remove("active");
                document.getElementById("loadingText").textContent = "正在处理...";
            }
        }

        // SAM: auto detect all objects
        async function samAutoDetect() {
            document.getElementById("loadingMask").classList.add("active");
            document.getElementById("loadingText").textContent = "SAM 自动检测中...";
            document.getElementById("statusText").textContent = "自动检测全部物体...";

            try {
                const resp = await fetch("/api/sam/auto-segment", { method: "POST" });
                const data = await resp.json();
                if (data.success) {
                    clearSamPoints();
                    document.getElementById("samAutoBar").style.display = "none";
                    document.getElementById("pointTypeToggle").style.display = "flex";
                    document.getElementById("samToolbar").style.display = "flex";
                    document.getElementById("samRefineHint").style.display = "block";
                    showSamCandidates(data.candidates);
                    document.getElementById("statusText").textContent =
                        `🎯 检测到 ${data.candidates.length} 个区域 — 选中最像衣服的遮罩`;
                } else {
                    document.getElementById("statusText").textContent = "❌ 自动检测失败";
                }
            } catch (e) {
                document.getElementById("statusText").textContent = "❌ 网络错误";
                console.error(e);
            } finally {
                document.getElementById("loadingMask").classList.remove("active");
                document.getElementById("loadingText").textContent = "正在处理...";
            }
        }

        // SAM: set point type
        function setSamPointType(type) {
            samPointType = type;
            document.querySelectorAll(".pt-positive, .pt-negative").forEach(b => b.classList.toggle("active", b.classList.contains("pt-" + type)));
        }

        // SAM: draw points on canvas
        function drawSamPoints() {
            const canvas = document.getElementById("pointCanvas");
            const img = document.getElementById("origImg");
            if (!canvas || !img || img.naturalWidth === 0) return;

            const rect = img.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scaleX = rect.width / img.naturalWidth;
            const scaleY = rect.height / img.naturalHeight;

            samPoints.forEach(p => {
                const cx = p.x * scaleX;
                const cy = p.y * scaleY;
                ctx.beginPath();
                ctx.arc(cx, cy, 6, 0, 2 * Math.PI);
                ctx.fillStyle = p.label === 1 ? "rgba(46, 204, 113, 0.85)" : "rgba(231, 76, 60, 0.85)";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 3, cy); ctx.lineTo(cx + 3, cy);
                ctx.moveTo(cx, cy - 3); ctx.lineTo(cx, cy + 3);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });
        }

        // SAM: add a point
        function addSamPoint(x, y) {
            const label = samPointType === "positive" ? 1 : 0;
            const existing = samPoints.findIndex(p => Math.abs(p.x - x) < 3 && Math.abs(p.y - y) < 3);
            if (existing >= 0) {
                samPoints.splice(existing, 1);
            } else {
                samPoints.push({ x, y, label });
            }
            updateSamUI();
            drawSamPoints();
        }

        function updateSamUI() {
            const pos = samPoints.filter(p => p.label === 1).length;
            const neg = samPoints.filter(p => p.label === 0).length;
            document.getElementById("samPointsInfo").textContent =
                samPoints.length > 0
                    ? `🟢 ${pos} 个前景 · 🔴 ${neg} 个背景（点击可移除）`
                    : "👆 点击原图添加点（正/负），或点结果图排除";
        }

        // SAM: clear all points
        function clearSamPoints() {
            samPoints = [];
            updateSamUI();
            const canvas = document.getElementById("pointCanvas");
            if (canvas) {
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            document.getElementById("statusText").textContent = "已清除所有点";
        }

        // SAM: click on orig image → add point
        function onOrigImageClick(e) {
            if (currentMode !== "sam" || !samLoaded) return;
            const img = document.getElementById("origImg");
            const rect = img.getBoundingClientRect();
            const scaleX = img.naturalWidth / rect.width;
            const scaleY = img.naturalHeight / rect.height;
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);
            addSamPoint(x, y);
        }

        // SAM: click on result image → add negative point & re-run
        function onResultImageClick(e) {
            if (currentMode !== "sam" || !samLoaded) return;
            const img = document.getElementById("resultImg");
            if (img.style.display === "none") return;

            const rect = img.getBoundingClientRect();
            const scaleX = img.naturalWidth / rect.width;
            const scaleY = img.naturalHeight / rect.height;
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);

            // Add as negative point
            const existing = samPoints.findIndex(p => Math.abs(p.x - x) < 3 && Math.abs(p.y - y) < 3);
            if (existing >= 0) {
                samPoints.splice(existing, 1);
            } else {
                samPoints.push({ x, y, label: 0 });
            }
            updateSamUI();
            drawSamPoints();
            runSam();
        }

        // SAM: run segmentation with all points
        async function runSam() {
            if (!samPoints.length) {
                document.getElementById("statusText").textContent = "⚠ 请先点击原图添加至少一个点";
                return;
            }

            document.getElementById("loadingMask").classList.add("active");
            document.getElementById("loadingText").textContent = "SAM 分割中...";
            document.getElementById("statusText").textContent =
                `分割中 (${samPoints.filter(p=>p.label===1).length} 前景, ${samPoints.filter(p=>p.label===0).length} 背景)...`;

            const formData = new FormData();
            formData.append("points_json", JSON.stringify(samPoints));

            try {
                const resp = await fetch("/api/sam/segment", { method: "POST", body: formData });
                const data = await resp.json();
                if (data.success) {
                    showSamCandidates(data.candidates);
                    document.getElementById("statusText").textContent =
                        `✅ ${samPoints.length} 个点 — ${data.candidates.length} 个候选`;
                } else {
                    document.getElementById("statusText").textContent = "❌ 分割失败";
                }
            } catch (e) {
                document.getElementById("statusText").textContent = "❌ 网络错误";
                console.error(e);
            } finally {
                document.getElementById("loadingMask").classList.remove("active");
                document.getElementById("loadingText").textContent = "正在处理...";
            }
        }

        // SAM: show candidates
        function showSamCandidates(candidates) {
            document.getElementById("samCandidates").style.display = "block";
            document.getElementById("samRefineHint").style.display = "block";
            document.getElementById("resultImg").classList.add("sam-has-result");

            const row = document.getElementById("candidateRowSide");
            row.innerHTML = "";

            function selectCandidate(i) {
                samSelectedIndex = i;
                const c = candidates[i];
                document.getElementById("resultImg").src = c.image;
                document.getElementById("resultImg").style.display = "block";
                document.getElementById("resultEmpty").style.display = "none";
                resultBase64 = c.image;
                document.getElementById("downloadBtn").disabled = false;
                Array.from(row.children).forEach((el, idx) => el.classList.toggle("active", idx === i));
            }

            candidates.forEach((c, i) => {
                const div = document.createElement("div");
                div.className = "candidate-item" + (i === 0 ? " active" : "");
                div.innerHTML = `
                    <img src="${c.image}" alt="候选${i}" />
                    <div class="candidate-info">
                        <div class="score">${c.area_pct}%</div>
                        <div>${c.label}</div>
                    </div>
                `;
                div.addEventListener("click", () => selectCandidate(i));
                row.appendChild(div);
            });

            selectCandidate(0);
        }

        // Load model status
        async function loadModelStatus() {
            try {
                const res = await fetch("/api/models");
                const data = await res.json();
                document.getElementById("modelDirPath").textContent = data.model_dir;
                const selected = document.getElementById("modelSelect").value;
                const model = data.models[selected];
                if (model) {
                    if (model.installed) {
                        document.getElementById("modelStatus").innerHTML = "✅ " + selected + " 已就绪";
                        document.getElementById("modelStatus").className = "model-status";
                    } else {
                        document.getElementById("modelStatus").innerHTML = "⚠️ " + selected + " 未安装 (" + model.size + ")";
                        document.getElementById("modelStatus").className = "model-status has-missing";
                    }
                }
            } catch(e) {}
        }
        async function openModelDir() {
            await fetch("/api/open-model-dir", {method: "POST"});
        }
        document.getElementById("modelSelect").addEventListener("change", loadModelStatus);
        loadModelStatus();

        // Resize: redraw SAM points
        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawSamPoints, 150);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <div class="sponsor-modal-overlay" id="sponsorModalOverlay" onclick="if(event.target===this)closeSponsorModal()">
        <div class="sponsor-modal">
            <div class="sponsor-header">
                <h2 id="sponsorTitle">赞助与教程</h2>
                <button class="sponsor-close" onclick="closeSponsorModal()">&times;</button>
            </div>
            <div class="sponsor-body" id="sponsorBody">
                <div class="loading" style="padding:20px">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        let _sponsorConfig = null;

        async function loadSponsorConfig() {
            if (_sponsorConfig) return _sponsorConfig;
            try {
                const res = await fetch('/api/sponsor/config');
                _sponsorConfig = await res.json();
            } catch(e) { _sponsorConfig = { methods: [], tutorials: [] }; }
            return _sponsorConfig;
        }

        async function openSponsorModal() {
            document.getElementById('sponsorModalOverlay').classList.add('active');
            const cfg = await loadSponsorConfig();
            const body = document.getElementById('sponsorBody');
            document.getElementById('sponsorTitle').textContent = '赞助与教程';

            let html = '';

            // 赞助方式 - 点击展开二维码
            html += '<div style="display:flex;gap:12px;justify-content:center;margin-bottom:18px;flex-wrap:wrap">';
            for (const m of (cfg.methods || [])) {
                const id = 'sm_' + m.name.replace(/\s/g, '_');
                html += '<div style="text-align:center">';
                html += '<button class="sponsor-btn" onclick="toggleQr(\'' + id + '\', \'' + (m.qr_image || '') + '\', \'' + (m.url || '') + '\')" style="min-width:80px">';
                html += m.icon + ' ' + m.name;
                html += '</button>';
                html += '</div>';
            }
            html += '</div>';

            // 二维码展示区（默认隐藏）
            html += '<div id="qrDisplay" style="text-align:center;display:none;margin-bottom:18px">';
            html += '<img id="qrImg" src="" style="max-width:220px;border-radius:10px;border:3px solid var(--border);display:none" />';
            html += '<div id="qrLoading" style="display:none;color:var(--text-dim)">加载中...</div>';
            html += '<div id="qrBtn" style="margin-top:10px;display:none"><button class="sponsor-btn sponsor-btn-copy" onclick="openTutorial(document.getElementById(\'qrBtn\').dataset.url)">打开链接</button></div>';
            html += '</div>';

            // 教程
            if ((cfg.tutorials || []).length > 0) {
                html += '<div class="sponsor-tutorials"><div class="st-label">教程</div>';
                for (const t of cfg.tutorials) {
                    html += '<a class="sponsor-tutorial-link" onclick="openTutorial(\'' + t.url + '\')">';
                    html += '<div class="sponsor-tutorial-icon">' + (t.icon || '▶') + '</div>';
                    html += '<div class="sponsor-tutorial-info"><div class="sponsor-tutorial-title">' + t.title + '</div>';
                    html += '<div class="sponsor-tutorial-desc">' + (t.desc || '点击在系统浏览器中打开') + '</div></div>';
                    html += '<div class="sponsor-tutorial-arrow">&#9656;</div></a>';
                }
                html += '</div>';
            }

            // 页脚
            html += '<div class="sponsor-footer">' + (cfg.project_name || '') + ' v' + (cfg.project_version || '') + '</div>';
            body.innerHTML = html;
        }

        let _currentQr = null;
        function toggleQr(id, qrImage, url) {
            const display = document.getElementById('qrDisplay');
            const img = document.getElementById('qrImg');
            const loading = document.getElementById('qrLoading');

            // 点击同一个按钮则关闭
            if (_currentQr === id) {
                display.style.display = 'none';
                img.style.display = 'none';
                img.src = '';
                _currentQr = null;
                return;
            }

            _currentQr = id;

            if (qrImage) {
                // 显示二维码
                display.style.display = 'block';
                loading.style.display = 'block';
                img.style.display = 'none';
                img.src = '';
                const qrSrc = qrImage.startsWith('http') ? qrImage : '/api/sponsor/assets/' + qrImage + '?t=' + Date.now();
                img.onload = function() {
                    loading.style.display = 'none';
                    img.style.display = 'block';
                };
                img.onerror = function() {
                    loading.innerHTML = '<span style="color:#f44">图片加载失败</span>';
                };
                img.src = qrSrc;
            } else if (url) {
                // 纯链接，直接打开
                display.style.display = 'none';
                openTutorial(url);
            }
        }

        function closeSponsorModal() {
            document.getElementById('sponsorModalOverlay').classList.remove('active');
        }

        async function openTutorial(url) {
            try {
                await fetch('/api/sponsor/open-external', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'url=' + encodeURIComponent(url)
                });
            } catch(e) { window.open(url, '_blank'); }
        }
    </script>
</body>
