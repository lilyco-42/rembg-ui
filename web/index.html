<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rembg Studio · 浏览器版</title>
<style>body{font:16px/1.6 system-ui;margin:0;background:#f5f5f2;color:#202c28}main{max-width:1000px;margin:50px auto;padding:24px}h1{font-size:36px;margin-bottom:8px}.note{color:#58665f}section{background:white;border:1px solid #dbe1da;border-radius:16px;padding:24px;margin:22px 0}button,select,input{font:inherit;margin:8px 10px 8px 0}button,a.download{background:#23694e;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}img{max-width:100%;max-height:420px;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/20px 20px}.download{display:inline-block;text-decoration:none;margin:10px 12px 0 0}#status{min-height:28px}footer{font-size:13px}a{color:#23694e}</style></head>
<style>.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}figure{margin:0;min-width:0}figcaption{font-weight:600;margin:0 0 10px}figure img{display:block;width:100%;height:420px;object-fit:contain;border:1px solid #dbe1da;box-sizing:border-box}h2{overflow-wrap:anywhere;font-size:20px}details{margin:20px 0}summary{cursor:pointer;padding:8px 0}details figure{max-width:460px;margin-top:12px}@media(max-width:600px){main{margin:12px auto;padding:14px}section{padding:16px}.comparison{grid-template-columns:1fr;gap:16px}figure img{height:auto;max-height:420px;object-fit:contain}input,select{max-width:100%;box-sizing:border-box}}</style>
<body><main><p class="note">WASM · 图片在你的设备处理</p><h1>商品图，打开网页就能做。</h1><p>无需安装 Python。左右对比原图与透明抠图结果，再下载交付商品图。</p>
<section><label>选择图片 <input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><br><label>输出规格 <select id="size"><option value="1200">1200 × 1200 白底，10% 留白</option><option value="1600">1600 × 1600 白底，10% 留白</option><option value="0">原尺寸透明 PNG</option></select></label><button id="run" disabled>开始处理</button><p id="status" role="status" aria-live="polite">选择图片后开始；最多 10 张，每张不超过 25 MB / 1600 万像素。</p><p class="note">轻量 U2Netp 模型约 4.6 MB，首次处理需加载 WASM。此版本用于浏览器移植验证，复杂边缘可能需要返修。</p></section>
