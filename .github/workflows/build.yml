name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: false
        type: string

permissions:
  contents: write

# 同一分支新推送时取消还在跑的旧构建，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (with dependency cache)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Nuitka 的 C 编译缓存（clcache）在本机 %LOCALAPPDATA%\Nuitka。
      # clcache 按内容寻址，源码改动只会重编译变更文件，因此缓存 key 用依赖锁文件即可最大化命中。
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Nuitka' || '~/.cache/Nuitka' }}
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "refs/tags/(v.*)") {
            $tag = $Matches[1]
          } elseif ("${{ inputs.version }}" -ne "") {
            $tag = "${{ inputs.version }}"
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            $tag = "v0.1.$date"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $tag"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: Compress-Archive -Path dist/main.dist/* -DestinationPath Rembg-UI-windows.zip

      - name: Create tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: Rembg-UI-windows.zip
          generate_release_notes: true
