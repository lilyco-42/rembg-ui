name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka
        run: uv run nuitka --standalone --windows-console-mode=disable --include-data-dir=frontend=frontend --include-package=fastapi --nofollow-import-to=fastapi.agents --include-windows-runtime-dlls=no --python-flag=-O --output-dir=dist main.py

      - name: Check build output
        run: |
          if (Test-Path "dist/main.dist/main.exe") {
            Write-Host "Build successful!"
            Get-ChildItem dist/main.dist/ | Select-Object Name,Length
          } else {
            Write-Error "Build failed - exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rembg-UI-windows
          path: dist/main.dist/

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/main.dist/* -DestinationPath Rembg-UI-windows.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rembg-UI-windows.zip
          generate_release_notes: true
