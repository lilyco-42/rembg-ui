name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Clone shared modules
        run: git clone https://github.com/lilyco-42/shared.git ${{ github.workspace }}/../shared

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka
        run: uv run python build_nuitka.py ${{ inputs.mode || 'release' }}

      - name: Check build output
        run: |
          if (Test-Path "dist/main.dist/main.exe") {
            Write-Host "Build successful!"
            Get-ChildItem dist/main.dist/ | Select-Object Name,Length
          } else {
            Write-Error "Build failed - exe not found"
            exit 1
          }

      - name: Package
        run: Compress-Archive -Path dist/main.dist/* -DestinationPath Rembg-UI-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rembg-UI-windows
          path: Rembg-UI-windows.zip

      - name: Update release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rembg-UI-windows.zip
          generate_release_notes: true
