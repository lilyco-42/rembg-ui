name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: false
        type: string
      include_cuda:
        description: "Build optional CUDA bundles (large; not part of the default release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一分支新推送时取消还在跑的旧构建，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    # 冷构建实测约 179 分钟（接近 180 上限），留足余量避免误触超时
    timeout-minutes: 240
    # 把最终版本号输出给 Linux/macOS job：它们必须沿用 Windows 算出的同一个 tag，
    # 不能自己重新算（时间戳跨分钟会不一致，导致追加到不存在的 Release）
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (with dependency cache)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Nuitka 的 C 编译缓存（clcache）在本机 %LOCALAPPDATA%\Nuitka。
      # clcache 按内容寻址，源码改动只会重编译变更文件，因此缓存 key 用依赖锁文件即可最大化命中。
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Nuitka' || '~/.cache/Nuitka' }}
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "refs/tags/(v.*)") {
            $tag = $Matches[1]
          } elseif ("${{ inputs.version }}" -ne "") {
            $tag = "${{ inputs.version }}"
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            $proj = "0.2.0"
            $m = Select-String -Path pyproject.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if ($m) { $proj = $m.Matches[0].Groups[1].Value }
            $tag = "v$proj-$date"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $tag"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: Compress-Archive -Path dist/rembg-ui.dist/* -DestinationPath Rembg-UI-windows.zip

      # 防止「固定版本号 → 空草稿」残留：若同 tag 已有手动建的草稿，先清掉，
      # 避免草稿与正式发布并存、Release 页出现空壳（此前 v0.2.0 / v0.1.20260722 均踩过）。
      # ⚠️ jq 的字符串字面量必须用双引号（.tag_name == "..."），单引号会让 jq 报
      #    "failed to parse jq expression / unexpected token" 直接失败（曾因此中断发布）。
      #    改用 bash 简化引号转义；Windows runner 自带 git-bash，可正常执行。
      - name: Remove stale draft release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id" 2>/dev/null || true); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" >/dev/null || true
            echo "[Release] 已清理同 tag 的旧草稿 release id=$id"
          done

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # The release API creates a missing tag at the exact checked-out SHA.
          # Do not git-push a tag from GITHUB_TOKEN: GitHub rejects a ref update
          # when this commit also changes workflow files (the token has no
          # workflow permission).
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: Rembg-UI-windows.zip
          generate_release_notes: true

  # Linux 构建：与 Windows 同一次触发内运行，等 Windows job 建好 Release 后把 tar.gz
  # 追加进同一个 Release。⚠️ 此前靠「Windows 自动 push tag → tag push 二次触发本 job」，
  # 但 GITHUB_TOKEN push 的 tag 不会触发新的 workflow run，导致 Linux/macOS 从未真正跑过；
  # 因此改为去掉 if 限制、直接从 build-windows 的 job outputs 取 tag，在同一 run 内完成。
  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-linux-

      - name: Install dependencies
        run: uv sync

      - name: Get version (from build-windows)
        id: version
        shell: bash
        run: |
          echo "tag=${{ needs.build-windows.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "Version: ${{ needs.build-windows.outputs.tag }}"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/Rembg-UI-linux.tar.gz -C dist/rembg-ui.dist .
          ls -lh dist/Rembg-UI-linux.tar.gz
          # GitHub Release 单资产硬上限 2 GiB，超限 gh release upload 直接 HTTP 422（曾因此失败）。
          # torch 已锁 CPU 版（见 pyproject.toml），正常应远低于上限；此守卫防回归并给出可读报错。
          SIZE=$(stat -c%s dist/Rembg-UI-linux.tar.gz)
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::tar.gz 为 $SIZE 字节，超过 GitHub Release 单资产 2 GiB 上限"
            exit 1
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" dist/Rembg-UI-linux.tar.gz --clobber

  # macOS 构建：Nuitka 产出 .app 应用包（release 模式自动附带 .dmg），追加到同一 Release。
  # 依赖 onnxruntime 已按平台区分（macOS 用 CPU 版），见 pyproject.toml 环境标记。
  # 与 build-linux 同理：去掉 if 限制，同一 run 内依赖 Windows 建好 Release 后追加资产。
  build-macos:
    runs-on: macos-latest
    needs: build-windows
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # macOS runner 可用空间仅 ~14 GB，而 Nuitka+torch 全量构建（编译中间产物 + dist + DMG
      # + ccache 缓存写入）轻松吃满：上次构建在 dist 数据文件复制阶段被硬杀，日志无任何报错。
      # 移除本工作流用不到的 Android SDK / ghcup（不同镜像位置不同，逐个尝试），可释放 ~10 GB。
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /Users/runner/Library/Android/sdk
          sudo rm -rf /usr/local/.ghcup ~/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-macos-

      - name: Install dependencies
        run: uv sync

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Get version (from build-windows)
        id: version
        shell: bash
        run: |
          echo "tag=${{ needs.build-windows.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "Version: ${{ needs.build-windows.outputs.tag }}"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package (.app / .dmg)
        id: package
        shell: bash
        run: |
          cd dist
          ls -la
          if compgen -G "*.dmg" >/dev/null; then
            mv *.dmg ../Rembg-UI-macOS.dmg
            # The next step runs from the repository root, so keep the output
            # path relative to that directory.
            echo "asset=Rembg-UI-macOS.dmg" >> "$GITHUB_OUTPUT"
            echo "已生成 DMG"
          elif compgen -G "*.app" >/dev/null; then
            zip -rq ../Rembg-UI-macOS.zip *.app
            echo "asset=Rembg-UI-macOS.zip" >> "$GITHUB_OUTPUT"
            echo "已生成 .app zip"
          else
            echo "::error::dist 下既无 .dmg 也无 .app（--mode=app 可能未生效，检查上方 ls 输出）"
            exit 1
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.package.outputs.asset }}" --clobber

  # ── CUDA 加速变体 ─────────────────────────────────────────────────────────
  # 默认产物精简（torch CPU、ORT 不带 CUDA 运行库）；-cuda 变体通过
  # `uv sync --extra cuda` 把 NVIDIA 官方 CUDA 12 运行库（cudnn9/cublas/cudart 等，
  # ~2.5 GB）打进产物并上传为 -cuda 后缀资产，用户免装 CUDA 即可 GPU 加速。
  # 依赖 build-windows 的 job outputs 提供同一个 tag，与其余变体追加进同一 Release。
  build-windows-cuda:
    # CUDA runtime bundles are optional: they can exceed GitHub's 2 GiB
    # per-release-asset limit and should not block the CPU/mobile release.
    if: github.event_name == 'workflow_dispatch' && inputs.include_cuda == true
    runs-on: windows-latest
    needs: build-windows
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Nuitka' || '~/.cache/Nuitka' }}
          key: nuitka-windows-cuda-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-windows-cuda-

      - name: Install dependencies (with CUDA runtime)
        run: uv sync --extra cuda

      - name: Get version (from build-windows)
        id: version
        shell: bash
        run: |
          echo "tag=${{ needs.build-windows.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/rembg-ui.dist/* -DestinationPath Rembg-UI-windows-cuda.zip
          $size = (Get-Item Rembg-UI-windows-cuda.zip).Length
          Write-Host "zip size: $([math]::Round($size / 1MB)) MB"
          # GitHub Release 单资产硬上限 2 GiB，超限上传会 HTTP 422（曾因此失败）
          if ($size -ge 2147483648) {
            Write-Error "Rembg-UI-windows-cuda.zip 为 $size 字节，超过 2 GiB 资产上限"
            exit 1
          }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" Rembg-UI-windows-cuda.zip --clobber

  build-linux-cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.include_cuda == true
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-cuda-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-linux-cuda-

      - name: Install dependencies (with CUDA runtime)
        run: uv sync --extra cuda

      - name: Get version (from build-windows)
        id: version
        shell: bash
        run: |
          echo "tag=${{ needs.build-windows.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/Rembg-UI-linux-cuda.tar.gz -C dist/rembg-ui.dist .
          ls -lh dist/Rembg-UI-linux-cuda.tar.gz
          # torch 已是 CPU 版 + CUDA 运行库 ~1 GB 压缩后，正常 ~1.6 GB，仍在 2 GiB 内；
          # 守卫防回归并给出可读报错
          SIZE=$(stat -c%s dist/Rembg-UI-linux-cuda.tar.gz)
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::tar.gz 为 $SIZE 字节，超过 GitHub Release 单资产 2 GiB 上限"
            exit 1
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" dist/Rembg-UI-linux-cuda.tar.gz --clobber

  # ── Android 原生端 ───────────────────────────────────────────────────────
  # 与桌面构建共用 Windows job 计算出的版本 tag。默认不带签名密钥时产出
  # unsigned APK/AAB；正式发行在仓库 secrets 注入 Play App Signing/上传密钥。
  build-android:
    name: Android (ABI APK + AAB)
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 45
    env:
      VERSION_TAG: ${{ needs.build-windows.outputs.tag }}
      ANDROID_KEYSTORE_B64: ${{ secrets.REMBG_ANDROID_KEYSTORE_BASE64 }}
      REMBG_RELEASE_STORE_PASSWORD: ${{ secrets.REMBG_RELEASE_STORE_PASSWORD }}
      REMBG_RELEASE_KEY_ALIAS: ${{ secrets.REMBG_RELEASE_KEY_ALIAS }}
      REMBG_RELEASE_KEY_PASSWORD: ${{ secrets.REMBG_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `tools` was removed from current command-line SDK repositories; keep
      # setup-android from requesting the historical default package.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare optional release signing
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            if [ -z "${REMBG_RELEASE_STORE_PASSWORD:-}" ] || [ -z "${REMBG_RELEASE_KEY_ALIAS:-}" ] || [ -z "${REMBG_RELEASE_KEY_PASSWORD:-}" ]; then
              echo "::error::REMBG_ANDROID_KEYSTORE_BASE64 requires all REMBG_RELEASE_* signing secrets"
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rembg-release.keystore"
            chmod 600 "$RUNNER_TEMP/rembg-release.keystore"
            echo "REMBG_RELEASE_STORE_FILE=$RUNNER_TEMP/rembg-release.keystore" >> "$GITHUB_ENV"
            echo "Release signing: configured"
          else
            echo "Release signing: no keystore secret; producing unsigned artifacts"
          fi

      - name: Set Android version
        shell: bash
        run: |
          version="${VERSION_TAG#v}"
          echo "REMBG_VERSION_NAME=$version" >> "$GITHUB_ENV"
          # run_number is monotonically increasing and satisfies Play's integer
          # versionCode requirement without deriving a value from a timestamp.
          echo "REMBG_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APKs and AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease :app:lintRelease

      - name: Stage Android release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*-release*.apk)
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "Expected 3 ABI APKs, found ${#apks[@]}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            abi=$(printf '%s' "$name" | sed -E 's/^app-(.*)-release(-unsigned)?\.apk$/\1/')
            cp "$apk" "dist/android/Rembg-UI-android-${abi}.apk"
          done
          cp android/app/build/outputs/bundle/release/app-release.aab dist/android/Rembg-UI-android.aab
          ls -lh dist/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rembg-android-${{ needs.build-windows.outputs.tag }}
          path: dist/android/
          if-no-files-found: error

      - name: Upload Android assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION_TAG" dist/android/* --clobber

