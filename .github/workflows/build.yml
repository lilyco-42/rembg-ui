name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: false
        type: string

permissions:
  contents: write

# 同一分支新推送时取消还在跑的旧构建，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (with dependency cache)
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Nuitka 的 C 编译缓存（clcache）在本机 %LOCALAPPDATA%\Nuitka。
      # clcache 按内容寻址，源码改动只会重编译变更文件，因此缓存 key 用依赖锁文件即可最大化命中。
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Nuitka' || '~/.cache/Nuitka' }}
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "refs/tags/(v.*)") {
            $tag = $Matches[1]
          } elseif ("${{ inputs.version }}" -ne "") {
            $tag = "${{ inputs.version }}"
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            $tag = "v0.1.$date"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $tag"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: Compress-Archive -Path dist/rembg-ui.dist/* -DestinationPath Rembg-UI-windows.zip

      # 固定版本号用法：
      #   - 推一个 v* tag 触发（例：git push origin v1.0.1），构建约 3 小时，完成后自动发 Release；
      #   - 或 Actions 页手动 workflow_dispatch 填 version。重复用同一版本号会更新已有 Release。
      # ⚠️ 构建期间不要再重推同 tag（concurrency 会取消进行中的构建）；也无需手动建草稿，
      #    workflow 会自动清理同 tag 的旧草稿。
      - name: Create tag (skip if already exists)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            git tag "${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
            echo "已创建并推送 tag ${{ steps.version.outputs.tag }}"
          else
            echo "tag ${{ steps.version.outputs.tag }} 已存在，跳过推送（更新已有 Release）"
          fi

      # 防止「固定版本号 → 空草稿」残留：若同 tag 已有手动建的草稿，先清掉，
      # 避免草稿与正式发布并存、Release 页出现空壳（此前 v0.2.0 / v0.1.20260722 均踩过）。
      - name: Remove stale draft release for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ids = gh api "repos/${{ github.repository }}/releases?per_page=100" `
            --jq ".[] | select(.draft == true and .tag_name == '$tag') | .id"
          foreach ($id in $ids) {
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" | Out-Null
            Write-Host "[Release] 已清理同 tag 的旧草稿 release id=$id"
          }

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: Rembg-UI-windows.zip
          generate_release_notes: true

  # Linux 构建：仅在打 tag / 手动触发时运行（Nuitka 构建很耗时，不随每次 push 跑），
  # 等 Windows job 建好 Release 后把自己的 tar.gz 追加进同一个 Release。
  build-linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-linux-

      - name: Install dependencies
        run: uv sync

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(v.*) ]]; then
            tag="${BASH_REMATCH[1]}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="v0.1.$(date +%Y%m%d-%H%M)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version: $tag"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/Rembg-UI-linux.tar.gz -C dist/rembg-ui.dist .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" dist/Rembg-UI-linux.tar.gz --clobber

  # macOS 构建：Nuitka 产出 .app 应用包（release 模式自动附带 .dmg），追加到同一 Release。
  # 依赖 onnxruntime 已按平台区分（macOS 用 CPU 版），见 pyproject.toml 环境标记。
  build-macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-${{ hashFiles('uv.lock') }}
          restore-keys: |
            nuitka-macos-

      - name: Install dependencies
        run: uv sync

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(v.*) ]]; then
            tag="${BASH_REMATCH[1]}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="v0.1.$(date +%Y%m%d-%H%M)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version: $tag"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package (.app / .dmg)
        id: package
        shell: bash
        run: |
          cd dist
          ls -la
          if compgen -G "*.dmg" >/dev/null; then
            mv *.dmg ../Rembg-UI-macOS.dmg
            echo "asset=../Rembg-UI-macOS.dmg" >> "$GITHUB_OUTPUT"
            echo "已生成 DMG"
          else
            zip -rq ../Rembg-UI-macOS.zip *.app
            echo "asset=../Rembg-UI-macOS.zip" >> "$GITHUB_OUTPUT"
            echo "已生成 .app zip"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.package.outputs.asset }}" --clobber

