name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Check build output
        run: |
          if (Test-Path "dist/main.dist/main.exe") {
            Write-Host "Build successful!"
            Get-ChildItem dist/main.dist/ | Select-Object Name,Length
          } else {
            Write-Error "Build failed - exe not found"
            exit 1
          }

      - name: Package
        run: Compress-Archive -Path dist/main.dist/* -DestinationPath Rembg-UI-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rembg-UI-windows
          path: Rembg-UI-windows.zip

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          files: Rembg-UI-windows.zip
          generate_release_notes: true
