name: WebGPU runtime cross-platform smoke
on:
  push:
    branches:
      - feat/desktop-webgpu-inference-20261028
    paths:
      - 'scripts/download_webgpu_model.py'
      - 'scripts/prepare_webgpu_model.py'
      - 'scripts/install_webgpu_runtime.py'
      - 'frontend/webgpu-infer.mjs'
      - 'main.py'
      - '.github/workflows/webgpu-cross-platform.yml'
  workflow_dispatch:
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model validation dependencies
        run: python -m pip install onnx onnxruntime numpy
      - name: Fetch verified model (China mirror first)
        run: python scripts/download_webgpu_model.py
      - name: Convert compatible WebGPU graph
        run: python scripts/prepare_webgpu_model.py
      - name: Bundle offline runtime (China npm mirror first)
        run: python scripts/install_webgpu_runtime.py
      - name: Syntax and asset checks
        shell: bash
        run: |
          python -m py_compile main.py scripts/download_webgpu_model.py scripts/install_webgpu_runtime.py scripts/prepare_webgpu_model.py
          node --check frontend/webgpu-infer.mjs
          test -s frontend/vendor/ort/ort.webgpu.min.mjs
          test -s frontend/vendor/ort/ort-wasm-simd-threaded.jsep.wasm
      - name: Compare original and converted CPU outputs at 320
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          root=Path.home()/'.u2net'
          rng=np.random.default_rng(42)
          x=rng.random((1,3,320,320)).astype(np.float32)
          results=[]
          for name in ('u2netp.onnx','u2netp-webgpu.onnx'):
              session=ort.InferenceSession(str(root/name),providers=['CPUExecutionProvider'])
              results.append(session.run(None,{session.get_inputs()[0].name:x})[0])
          assert results[0].shape == results[1].shape == (1,1,320,320)
          np.testing.assert_allclose(*results,rtol=1e-5,atol=1e-6)
          print('CPU-equivalent graphs: PASS')
          PY
