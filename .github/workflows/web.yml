name: Build WASM demo
on:
  workflow_dispatch:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install browser acceptance dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Real WASM region cutout and mobile touch acceptance
        run: node browser/region-acceptance.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rembg-region-acceptance
          path: web/browser-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: rembg-wasm-site
          path: web/dist/
          include-hidden-files: true
